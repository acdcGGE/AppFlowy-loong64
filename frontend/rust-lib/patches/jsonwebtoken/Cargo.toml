[package]
name = "jsonwebtoken"
version = "8.3.0"
edition = "2021"
description = "Minimal HS256-only jsonwebtoken shim for loongarch64 (ring has no LoongArch support)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
